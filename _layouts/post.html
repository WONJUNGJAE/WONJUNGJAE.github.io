---
layout: default
---
<article class="post-article">
  <header class="post-header">
    <div class="post-meta"><span>{{ page.date | date: '%Y.%m.%d' }}</span>{% for c in page.categories %}<span>#{{ c | escape }}</span>{% endfor %}</div>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="post-subtitle">{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="post-body">{{ content }}</div>
  <div class="post-bottom"><a class="text-link" href="{{ '/' | relative_url }}">홈으로</a></div>
</article>
