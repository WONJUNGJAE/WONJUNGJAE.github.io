<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<div class="page-shell">
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav class="top-nav" aria-label="주 메뉴">
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>소개</a>
      {% if site.github_username != '' %}<a href="https://github.com/{{ site.github_username | escape }}" target="_blank" rel="noopener noreferrer">GitHub</a>{% endif %}
    </nav>
  </header>

  <nav class="category-nav" aria-label="카테고리">
    <a href="{{ '/development/' | relative_url }}" {% if page.url == '/development/' %}aria-current="page"{% endif %}>개발</a>
    <a href="{{ '/ctf-wargame/' | relative_url }}" {% if page.url == '/ctf-wargame/' %}aria-current="page"{% endif %}>CTF/Wargame</a>
    <a href="{{ '/bug-bounty/' | relative_url }}" {% if page.url == '/bug-bounty/' %}aria-current="page"{% endif %}>Bug Bounty</a>
    <a href="{{ '/tech-docs/' | relative_url }}" {% if page.url == '/tech-docs/' %}aria-current="page"{% endif %}>블로그/기술문서</a>
    <a href="{{ '/papers-conferences/' | relative_url }}" {% if page.url == '/papers-conferences/' %}aria-current="page"{% endif %}>논문·컨퍼런스</a>
    <a href="{{ '/competitions-certificates/' | relative_url }}" {% if page.url == '/competitions-certificates/' %}aria-current="page"{% endif %}>공모전·자격증</a>
  </nav>

  <main class="main-content" id="main-content">{{ content }}</main>

</div>
</body>
</html>
