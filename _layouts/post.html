---
layout: default
---
<article class="post-article">
  <header class="post-header">
    <p class="eyebrow">STUDY NOTE / {{ page.date | date: '%Y.%m.%d' }}</p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="post-subtitle">{{ page.description | escape }}</p>{% endif %}
    <div class="post-meta">{% for c in page.categories %}<span class="tag">#{{ c | escape }}</span>{% endfor %}</div>
  </header>
  <div class="post-body">{{ content }}</div>
  <div class="post-bottom"><a class="back-link" href="{{ '/' | relative_url }}">← 홈으로 돌아가기</a></div>
</article>
